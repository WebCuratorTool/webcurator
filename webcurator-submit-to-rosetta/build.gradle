plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()

//    maven {
//        url = 'https://builds.archive.org/maven2'
//    }

    maven {
        url = 'https://repo1.maven.org/maven2'
    }

    maven{
        url = 'https://repository.cloudera.com/artifactory/libs-release-local/'
    }
}


// bootJar {
//     duplicatesStrategy = DuplicatesStrategy.EXCLUDE
// }

dependencies {  
    api 'net.sourceforge.jexcelapi:jxl:2.6.12'
    api 'com.exlibris:dps-sdk:7.1.0'
    api 'com.exlibris:dps-sdk-deposit-api:7.1.0'
    api ('org.webcurator:webcurator-core:3.2.5-SNAPSHOT'){
        exclude group: 'org.springframework'
        exclude group: 'org.glassfish.jaxb', module: 'jaxb-runtime'
    }
    api 'dom4j:dom4j:1.6.1'
    api 'com.google.code.guice:guice:1.0'
    api 'commons-logging:commons-logging:1.2'
    api 'log4j:log4j:1.2.17'
    api 'javax.xml.ws:jaxws-api:2.3.1'
    api ('com.sun.xml.ws:jaxws-rt:4.0.5'){
        exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    }
    api 'com.jcraft:jsch:0.1.55'

    testImplementation 'org.jmock:jmock:2.4.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'jmock:jmock-cglib:1.2.0'
    testImplementation 'org.objenesis:objenesis:1.0'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    testImplementation 'org.springframework:spring-core'
}

group = 'org.webcurator'
version = '3.2.5-SNAPSHOT'
description = 'Web Curator Tool Submit-to-Rosetta'

java {
	sourceCompatibility = '1.8'
	targetCompatibility = '1.25'
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from(sourceSets.main.allJava)
}

task testsJar(type: Jar) {
    archiveClassifier.set('tests')
    from(sourceSets.test.output)
}

// just an alias
task install(dependsOn: ['build', 'publishToMavenLocal'])

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
            artifact(sourcesJar)
            artifact(testsJar)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
}

